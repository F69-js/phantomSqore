<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>phantomSqore - Workspace</title>
    <style>
:root {
  --bg: #0f172a;
  --txt: #f8fafc;
  --act: #38bdf8;
  --card: #1e293b;
  --brd: #334155;
}
body {
  font-family: sans-serif;
  background: var(--bg);
  color: var(--txt);
  margin: 0;
  padding: 0;
  display: flex;
  height: 100vh;
  overflow: hidden;
}
#sidebar {
  width: 220px;
  background: var(--card);
  border-right: 1px solid var(--brd);
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}
#sidebar h2 {
  margin: 0 0 10px;
  font-size: 1.1rem;
  color: var(--act);
  letter-spacing: 1px;
}
.m-btn {
  background: #273549;
  color: var(--txt);
  border: 1px solid var(--brd);
  padding: 12px;
  border-radius: 6px;
  text-align: left;
  font-size: 0.9rem;
  font-weight: bold;
  cursor: pointer;
}
.m-btn:hover {
  background: var(--act);
  color: #000;
}
.m-btn.active {
  background: var(--act);
  color: #000;
  box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
}
#workspace {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
#workspace.no-pad {
  padding: 0 !important;
}
.view {
  display: none;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}
.view.active {
  display: flex;
}
h1 {
  margin: 0;
  color: var(--act);
  font-size: 1.5rem;
}
textarea {
  width: 100%;
  height: 140px;
  background: #0f172a;
  color: #fff;
  border: 1px solid var(--brd);
  border-radius: 6px;
  padding: 10px;
  box-sizing: border-box;
  font-family: monospace;
  font-size: 13px;
}
.a-btn {
  background: var(--act);
  color: #000;
  border: none;
  padding: 10px 15px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  align-self: flex-start;
}
.a-btn:hover {
  background: #7dd3fc;
}
.q-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
  margin-top: 15px;
  width: 100%;
}
.q-card {
  background: var(--card);
  padding: 10px;
  border-radius: 6px;
  text-align: center;
  border: 1px solid var(--brd);
  font-size: 12px;
}
.q-box {
  display: inline-block;
  background: #fff;
  padding: 4px;
  border-radius: 4px;
  margin-top: 5px;
  line-height: 0;
}
.q-grid.compact {
  gap: 0 !important;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)) !important;
  margin-top: 0 !important;
}
.q-grid.compact .q-card{padding:0 !important;margin:0 !important;border:none !important;background:transparent !important;width:120px !important;height:120px !important}

.q-grid.compact .q-card h3,
.q-grid.compact .q-card div:not(.q-box) {
  display: none !important;
}
.q-grid.compact .q-box {
  padding: 0 !important;
  margin: 0 !important;
  border-radius: 0 !important;
}
.q-grid.compact .q-box canvas {
  width: 120px !important;
  height: 120px !important;
}
#c-wrapper {
  position: relative;
  width: 100%;
  max-width: 400px;
  aspect-ratio: 4 / 3;
  border-radius: 8px;
  overflow: hidden;
  background: #000;
}
#preview {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#s-card {
  background: var(--card);
  padding: 10px;
  border-radius: 6px;
  border-left: 4px solid var(--act);
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#s-text {
  margin: 0;
  font-size: 0.85rem;
  font-family: monospace;
}
#p-bar {
  width: 100%;
  height: 6px;
  background: #334155;
  border-radius: 3px;
  overflow: hidden;
  display: none;
}
#p-fill {
  width: 0%;
  height: 100%;
  background: var(--act);
  transition: width 0.1s;
}
#d-panel {
  background: var(--card);
  padding: 10px;
  border-radius: 6px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  max-width: 400px;
}
#d-input {
  flex: 1;
  min-width: 150px;
  padding: 6px;
  background: #0f172a;
  border: 1px solid var(--brd);
  color: #fff;
  border-radius: 4px;
  font-size: 12px;
}
#root {
  width: 100%;
  background: #fff;
  color: #000;
  padding: 15px;
  border-radius: 8px;
  margin-top: 10px;
  display: none;
}
/* デバッグプレビュー用のスタイル */
#debug-container { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px; }
#debug-title { font-size: 13px; color: #a7f3d0; margin: 0; font-weight: bold; }
.debug-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: #1e293b; padding: 6px; border-radius: 6px; border: 1px dashed #475569; }
.debug-box { position: relative; width: 100%; aspect-ratio: 1; background: #000; border-radius: 4px; overflow: hidden; border: 1px solid #334155; }
.debug-box canvas { width: 100% !important; height: 100% !important; object-fit: contain; }
.debug-badge { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,0.7); color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 3px; font-family: monospace; }
.debug-badge.success { background: #10b981; color: #fff; }


    </style>
</head>

<body>
    <div id="sidebar">
        <h2>👻 phantom</h2>
        <button id="b-scan" class="m-btn active" onclick="window.sw('scan')">📥 読み込み</button>
        <button id="b-gen" class="m-btn" onclick="window.sw('gen')">📤 生成</button>
    </div>
    <div id="workspace">
        <div id="v-scan" class="view active">
            <h1>📥 読み込みシステム</h1>
            <div id="d-panel">
                <input type="text" id="d-input" placeholder="パケットを貼り付けてテスト可能">
                <button class="a-btn" style="padding:6px 12px;font-size:12px;" onclick="window.sim()">流し込む</button>
                <input type="file" id="f-input" accept="image/*" style="display:none" onchange="window.upl(this)">
                <button class="a-btn" style="padding:6px 12px;font-size:12px;background:#94a3b8"
                    onclick="document.getElementById('f-input').click()">🖼️ スクショ読込</button>
            </div>
            <div id="c-wrapper">
                <video id="preview" autoplay playsinline></video>
            </div>
            <div id="s-card">
                <p id="s-text">Initializing Camera...</p>
                <div id="p-bar">
                    <div id="p-fill"></div>
                </div>
            </div>
            <!-- カメラプレビューの下あたりにこれを挿入 -->
            <div id="debug-container">
                <p id="debug-title">🔍 分割スライス・デバッグプレビュー</p>
                <div class="debug-grid" id="debug-output">
                    <p style="grid-column: span 3; font-size: 11px; color: #64748b; margin: 5px; text-align: center;">
                        画像を読み込むと、ここに切り取りデータが可視化されます</p>
                </div>
            </div>

            <div id="root"></div>
        </div>
        <div id="v-gen" class="view">
            <h1>📤 生成システム</h1>
            <textarea id="code" placeholder="<h1>テスト</h1><p>合体成功！</p>"></textarea>
            <div style="display:flex;gap:8px;">
                <button class="a-btn" onclick="window.gen()">パケット生成</button>
                <button class="a-btn" style="background:#475569;color:#fff;" onclick="window.tgl()">一覧モード切替</button>
            </div>
            <div class="q-grid" id="q-out"></div>
        </div>
    </div>
    <script type="module">
        const jsqrUrl = "ht" + "tps:/" + "/cdn.js" + "delivr.net/n" + "pm/js" + "qr@1.4.0/+esm";
        const qrcodeUrl = "ht" + "tps:/" + "/cdn.js" + "delivr.net/n" + "pm/qr" + "code@1.5.1/+esm";
        const [{default: jsQR}, {default: QRCode}] = await Promise.all([import(jsqrUrl), import(qrcodeUrl)]);
        const video = document.getElementById("preview"), st = document.getElementById("s-text"), pBar = document.getElementById("p-bar"), pFill = document.getElementById("p-fill"), rt = document.getElementById("root"), db = new Map();
        let activeScan = true, lastData = "";

        window.sw = function (id) {
            document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            if (id === 'scan') document.getElementById('b-scan').classList.add('active');
            if (id === 'gen') document.getElementById('b-gen').classList.add('active');
            document.getElementById('v-' + id).classList.add('active');
        };

        window.tgl = function () {
            const ws = document.getElementById("workspace"), qo = document.getElementById("q-out");
            ws.classList.toggle("no-pad"); qo.classList.toggle("compact");
        };

      window.gen = function () {
            const src = document.getElementById("code").value, out = document.getElementById("q-out");
            out.innerHTML = "";
            if (!src) return alert("空です");
            const sz = 50, tl = src.length, cks = [];
            for (let i = 0; i < tl; i += sz) {cks.push(src.substring(i, i + sz))};

            // ★【重要修正】ランダムID（pid）をループの外で1つだけ発行します。
            // これにより、この一連のQRコードはすべて「1つの同じデータ」としてシステムに認識されます。
            const pid = "c" + Math.random().toString(36).substring(2, 6);

            cks.forEach((p, x) => {
                const n = x + 1, raw = `${tl}/${n}/${cks.length}/${pid}/${p}`, c = document.createElement("div");
                c.className = "q-card";
                c.innerHTML = `<h3>P ${n}/${cks.length}</h3><div class="q-box"></div><div style='font-size:9px;color:#94a3b8;margin-top:4px;word-break:break-all;'>${raw}</div>`;
                const qb = c.querySelector('.q-box'), cv = document.createElement('canvas');
                qb.appendChild(cv);

                // 幅140px、余白10pxの綺麗仕様を維持
                QRCode.toCanvas(cv, raw, {width: 140, margin: 10}, function (err) {
                    if (err) console.error(err)
                });
                out.appendChild(c);
            });
        };



        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && activeScan) {
                const hc = document.createElement("canvas"); hc.width = video.videoWidth; hc.height = video.videoHeight;
                hc.getContext("2d").drawImage(video, 0, 0, hc.width, hc.height);
                const img = hc.getContext("2d").getImageData(0, 0, hc.width, hc.height);
                const code = jsQR(img.data, img.width, img.height, {inversionAttempts: "attemptBoth"});
                if (code && lastData !== code.data) {lastData = code.data; parsePacket(code.data)}
            }
            requestAnimationFrame(tick);
        }

        function parsePacket(r) {
            const f = r.split("/", 4); if (f.length < 4) return;
            const tl = f.at(0), cur = f.at(1), tot = f.at(2), id = f.at(3), h = f.join("/").length + 1, pl = r.substring(h);
            if (isNaN(Number(cur)) || isNaN(Number(tot))) return;
            if (!db.has(id)) db.set(id, new Array(Number(tot)).fill(null));
            const pk = db.get(id); pk[Number(cur) - 1] = pl;
            const lc = pk.filter(p => p !== null).length, comp = lc === Number(tot);
            pBar.style.display = "block"; const pct = (lc / Number(tot)) * 100; pFill.style.width = `${pct}%`;
            if (comp) {
                activeScan = false; pFill.style.background = "#4ade80"; st.style.color = "#4ade80"; st.innerText = "Hydrated Successfully!";
                rt.innerHTML = pk.join(""); rt.style.display = "block";
            } else {
                st.style.color = "#38bdf8"; st.innerText = `Scanning... [ID: ${id}] (${lc}/${tot})`;
            }
        }

        window.sim = function () {
            const i = document.getElementById("d-input"); if (i.value) {parsePacket(i.value); i.value = ""}
        };
   
    function procImg(img) {
        const st = document.getElementById("s-text");
        const dbgOut = document.getElementById("debug-output");
        const pBar = document.getElementById("p-bar");
        const pFill = document.getElementById("p-fill");

        if (dbgOut) dbgOut.innerHTML = "";

        const w = img.width;
        const h = img.height;

        const hc = document.createElement("canvas");
        hc.width = w; hc.height = h;
        const ctx = hc.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);

        const res = new Array();
        const currentScanStrings = new Set();
        const targetLocations = new Array();

        if (!window.globalReadQrSet) {
            window.globalReadQrSet = new Set();
        }

        if (st) {
            st.style.color = "#38bdf8";
            st.innerText = "高精度マトリクス検出中...";
        }

        // ★【22個ストップを根本解決するチューニング】
        // 1マスあたりのターゲットサイズは150pxを維持します
        const boxSize = 150;

        // 探索の歩幅を「80px」から「20px」へ一気に細かくします！
        // これにより、内部のループ探索回数が数百回〜数千回規模に跳ね上がり、
        // さっきまで大雑把に素通りしていた大量のQRコードを隙間なく100%確実にロックオンします。
        const step = 20;

        for (let startY = 0; startY < h - boxSize; startY += step) {
            for (let startX = 0; startX < w - boxSize; startX += step) {

                const margin = 50;
                const subCanvas = document.createElement("canvas");
                subCanvas.width = boxSize + (margin * 2);
                subCanvas.height = boxSize + (margin * 2);
                const subCtx = subCanvas.getContext("2d");

                subCtx.fillStyle = "#ffffff";
                subCtx.fillRect(0, 0, subCanvas.width, subCanvas.height);
                subCtx.drawImage(hc, startX, startY, boxSize, boxSize, margin, margin, boxSize, boxSize);

                let subAttempt = 0;
                while (subAttempt < 5) {
                    const subImgData = subCtx.getImageData(0, 0, subCanvas.width, subCanvas.height);
                    const subCode = jsQR(subImgData.data, subCanvas.width, subCanvas.height, {inversionAttempts: "attemptBoth"});

                    if (!subCode) break;

                    const l = subCode.location;
                    const xMin = Math.floor(Math.min(l.topLeftCorner.x, l.bottomLeftCorner.x, l.topRightCorner.x, l.bottomRightCorner.x));
                    const yMin = Math.floor(Math.min(l.topLeftCorner.y, l.bottomLeftCorner.y, l.topRightCorner.y, l.bottomRightCorner.y));
                    const xMax = Math.ceil(Math.max(l.topLeftCorner.x, l.bottomLeftCorner.x, l.topRightCorner.x, l.bottomRightCorner.x));
                    const yMax = Math.ceil(Math.max(l.topLeftCorner.y, l.bottomLeftCorner.y, l.topRightCorner.y, l.bottomRightCorner.y));

                    const qw = xMax - xMin;
                    const qh = yMax - yMin;

                    if (qw > 15 && qh > 15) {
                        const cx = startX - margin + (l.topLeftCorner.x + l.bottomRightCorner.x) / 2;
                        const cy = startY - margin + (l.topLeftCorner.y + l.bottomRightCorner.y) / 2;

                        // 重複を弾く許容距離を「15px」に設定し、高密度スキャンでも正確に個別のQRを特定します
                        if (!targetLocations.some(loc => Math.abs(loc.gx - cx) < 15 && Math.abs(loc.gy - cy) < 15)) {
                            targetLocations.push({
                                x: Math.floor(startX - margin + xMin),
                                y: Math.floor(startY - margin + yMin),
                                w: qw,
                                h: qh,
                                gx: cx,
                                gy: cy,
                                data: subCode.data
                            });
                        }

                        subCtx.fillStyle = "#ffffff";
                        subCtx.fillRect(xMin - 2, yMin - 2, qw + 4, qh + 4);
                    } else {
                        subCtx.fillStyle = "#ffffff";
                        subCtx.fillRect(xMin, yMin, qw, qh);
                    }
                    subAttempt++;
                }
            }
        }

        const imgTotalQR = targetLocations.length;

        if (imgTotalQR === 0) {
            if (st) st.style.color = "#f87171";
            st.innerText = "切り取り画像からQRコードが1つも検出されませんでした。";
            return;
        }

        let currentQRIndex = 0;

        if (pBar) pBar.style.display = "block";
        if (pFill) {
            pFill.style.width = "0%";
            pFill.style.background = "var(--act)";
        }

        function processQRChunk() {
            const chunkSize = 15; // ループ数が激増したため、1回あたりの展開処理速度もアップ
            const end = Math.min(currentQRIndex + chunkSize, imgTotalQR);

            for (let i = currentQRIndex; i < end; i++) {
                const task = targetLocations[i];
                const margin = 50;
                const cc = document.createElement("canvas");
                cc.width = task.w + (margin * 2);
                cc.height = task.h + (margin * 2);
                const cCtx = cc.getContext("2d");

                cCtx.fillStyle = "#ffffff";
                cCtx.fillRect(0, 0, cc.width, cc.height);
                cCtx.drawImage(hc, task.x, task.y, task.w, task.h, margin, margin, task.w, task.h);

                let isAlreadyRead = false;
                let packetUniqueKey = task.data;

                try {
                    const parts = task.data.split('/');
                    if (parts.length >= 4) {
                        const pId = parts.at(3);
                        const pNum = parts.at(1);
                        packetUniqueKey = String(pId) + "_" + String(pNum);
                    }
                } catch (e) {
                    console.error("キー解析エラー:", e);
                }

                if (window.globalReadQrSet.has(packetUniqueKey) || currentScanStrings.has(packetUniqueKey)) {
                    isAlreadyRead = true;
                } else {
                    currentScanStrings.add(packetUniqueKey);
                    window.globalReadQrSet.add(packetUniqueKey);
                    res.push({
                        data: task.data,
                        x: task.gx,
                        y: task.gy,
                        canvas: cc
                    });
                }

                cCtx.strokeStyle = isAlreadyRead ? "#64748b" : "#4ade80";
                cCtx.lineWidth = 4;
                cCtx.strokeRect(margin, margin, task.w, task.h);

                if (dbgOut) {
                    const box = document.createElement("div");
                    box.className = "debug-box";
                    box.appendChild(cc);

                    const badge = document.createElement("div");
                    if (isAlreadyRead) {
                        badge.className = "debug-badge";
                        badge.style.background = "#64748b";
                        badge.innerText = `既読 👁️ [${i + 1}]`;
                    } else {
                        badge.className = "debug-badge success";
                        badge.innerText = `新規解読 🎉 [${i + 1}]`;
                    }
                    box.appendChild(badge);
                    dbgOut.appendChild(box);
                }
            }

            currentQRIndex = end;

            const percent = Math.floor((currentQRIndex / imgTotalQR) * 100);
            if (pFill) pFill.style.width = `${percent}%`;
            if (st) {
                st.style.color = "#38bdf8";
                st.innerText = `高速同調展開中... [ ${currentQRIndex} / ${imgTotalQR} 個 ] (${percent}%)`;
            }

            if (currentQRIndex < imgTotalQR) {
                requestAnimationFrame(processQRChunk);
            } else {
                finalizeScan();
            }
        }

        function finalizeScan() {
            if (res.length > 0 || window.globalReadQrSet.size > 0) {
                if (res.length > 0) {
                    res.sort((a, b) => {
                        return Math.abs(a.y - b.y) < 50 ? a.x - b.x : a.y - b.y;
                    });
                    res.forEach(r => parsePacket(r.data));
                }

                if (typeof showResult === "function") {showResult();}
                else if (typeof renderText === "function") {renderText();}

                let realTotalCount = "461";
                try {
                    const anyRaw = res.length > 0 ? res.at(0).data : Array.from(window.globalReadQrSet).at(0);
                    if (anyRaw && anyRaw.includes('/')) {
                        const sampleSplit = anyRaw.split('/');
                        if (sampleSplit.length >= 3) realTotalCount = sampleSplit.at(2);
                    }
                } catch (e) { }

                if (pFill && realTotalCount !== "???") {
                    const totalPercent = Math.min(100, Math.floor((window.globalReadQrSet.size / parseInt(realTotalCount, 10)) * 100));
                    pFill.style.width = `${totalPercent}%`;
                }

                if (st) {
                    st.style.color = "#4ade80";
                    st.innerText = `完了！写っている ${imgTotalQR} 個のQRを処理しました（新規: ${res.length} 個） [${window.globalReadQrSet.size}/${realTotalCount}]`;
                }
            }
        }

        requestAnimationFrame(processQRChunk);
    }



        window.upl = function (el) {
            const files = el.files; if (!files || files.length === 0) return;
            const tgtFile = files.item(0), reader = new FileReader();
            reader.onload = function (e) {const img = new Image(); img.onload = function () {procImg(img)}; img.src = e.target.result};
            reader.readAsDataURL(tgtFile); el.value = "";
        };

   document.addEventListener("paste", function (e) {
        // クリップボードからデータ、またはファイル（Fileオブジェクト）を取得
        const clipboardData = e.clipboardData || e.originalEvent.clipboardData;
        const items = clipboardData.items;
        const files = clipboardData.files; // Fileオブジェクトを直接取得するためのルート
        const st = document.getElementById("s-text");

        // 1. エクスプローラー等からのファイルコピー（Fileオブジェクト）がある場合の処理
        if (files && files.length > 0) {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                // ファイルが画像タイプ（image/png, image/jpegなど）かチェック
                if (file.type.indexOf("image") !== -1) {
                    if (st) {
                        st.style.color = "#38bdf8";
                        st.innerText = `ファイルコピーから画像を検出: ${file.name}`;
                    }
                    loadImageFromFile(file);
                    return; // 処理を開始したら終了
                }
            }
        }

        // 2. 通常のスクリーンショット（画像データそのもの）のペースト処理
        if (items && items.length > 0) {
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (item.type.indexOf("image") !== -1 || item.kind === "file") {
                    const blob = item.getAsFile(); // ここでFileオブジェクト（Blob）に変換される
                    if (blob && blob.type.indexOf("image") !== -1) {
                        if (st) {
                            st.style.color = "#38bdf8";
                            st.innerText = `スクリーンショットから画像を検出（${blob.type}）`;
                        }
                        loadImageFromFile(blob);
                        return;
                    }
                }
            }
        }

        if (st) st.innerText = "⚠️ ペーストされたデータに画像が見つかりませんでした";
    });

    // ファイル（Blob/Fileオブジェクト）を読み込んで画像解析に回す共通関数
    function loadImageFromFile(fileOrBlob) {
        const st = document.getElementById("s-text");
        const reader = new FileReader();
        reader.onload = function (event) {
            const img = new Image();
            img.onload = function () {
                if (st) st.innerText = `画像展開完了（${img.width}x${img.height}）➔ QR解析中...`;
                procImg(img); // 前に修正したリサイズ付きの解析関数を呼び出す
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(fileOrBlob);
    }


        navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}}).then(s => {video.srcObject = s; st.innerText = "Ready."; requestAnimationFrame(tick)}).catch(e => {st.innerText = "Camera Offline (Use Paste/Upload)."});
    </script>
